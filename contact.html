  <main>
    <section>
      <div class="wrap text">
        <h1>Contact</h1>
        <p>Send me a message and I will reply as soon as I can.</p>

        <form id="contact-form" novalidate><!--Contact form with name, email, and message fields-->
          <label for="name">Name</label>
          <input id="name" type="text">
          <p class="error" id="name-error"></p>

          <label for="email">Email</label>
          <input id="email" type="email">
          <p class="error" id="email-error"></p>

          <label for="message">Message</label>
          <textarea id="message" rows="6"></textarea>
          <p class="error" id="message-error"></p>

          <button class="button" type="submit">Send message</button>
          <p id="form-result"></p>
        </form>
        <!--Contact information with GitHub link, email, and phone number-->
        <p>You can also find my code on <a href="https://github.com/kgryciuk">GitHub</a>.</p>
        <p>You can also reach me via email at <a href="mailto:kgryciuk03@gmail.com">kgryciuk03@gmail.com</a> or over the phone at <a href="tel:+16316243697">+1 (631) 624-3697</a>.</p>
      </div>
    </section>
