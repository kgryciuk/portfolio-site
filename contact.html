<div class="wrap bar">
<a class="brand" href="index.html">Koby Gryciuk</a>
<button class="menu-toggle" id="menuToggle" aria-expanded="false" aria-controls="siteNav">Menu</button>
<nav aria-label="Main"><ul id="siteNav" class="nav"><li><a href="index.html">Home</a></li><li><a href="about.html">About</a></li><li><a href="projects.html">Projects</a></li><li><a href="skills.html">Skills &amp; Training</a></li><li><a href="contact.html" aria-current="page">Contact</a></li></ul></nav>

<main id="main">
<section class="page-title"><div class="wrap"><h1>Contact</h1><p>Send me a message and I will reply as soon as I can.</p></div></section>
<section class="section">
<div class="wrap narrow">
<form id="contactForm" novalidate>
<div class="field"><label for="name">Name</label><input id="name" name="name" type="text" autocomplete="name" required><span class="error" id="nameError" role="alert"></span></div>
<div class="field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required><span class="error" id="emailError" role="alert"></span></div>
<div class="field"><label for="message">Message</label><textarea id="message" name="message" rows="6" required></textarea><span class="error" id="messageError" role="alert"></span></div>
<button class="btn" type="submit">Send message</button>
<p id="formStatus" class="status" role="status" tabindex="-1"></p>
</form>
<p>You can also find my code on <a href="https://github.com/" target="_blank" rel="noopener">GitHub</a>.</p>
</div>
</section>

</main>
